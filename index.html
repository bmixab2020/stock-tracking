<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Tracking</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Stock Tracking</h1>
  </header>
  <main>
    <section class="search-section">
      <input id="symbolInput" type="text" placeholder="Stock symbol (e.g. AAPL)" />
      <button id="addBtn" title="Search and add stock symbol to selected watchlist">Search &amp; Add</button>
      <div class="field" id="listField">
        <select id="listSelect"></select>
        <div id="newListWrap" style="display:none; gap:4px; align-items:center;">
          <input id="newListInput" type="text" placeholder="Watchlist Name" />
          <button id="saveNewListBtn" title="Save new watchlist">Save</button>
          <button id="cancelNewListBtn" title="Cancel add new watchlist">Cancel</button>
        </div>
      </div>
      <button id="deleteListBtn" title="Delete the selected watchlist">Delete watchlist</button>
      <span id="status"></span>
    </section>

    <section class="view-section">
      <button id="refreshBtn">Refresh</button>
      <button id="exportBtn" title="Export local repository">Export</button>
      <input id="importInput" type="file" accept="application/json" style="display:none" />
      <button id="importBtn" title="Import local repository">Import</button>
      <button id="clearBtn" title="Clear local repository">Clear</button>
      <button id="printBtn">Print</button>
    </section>

    <section class="table-section">
      <table id="stockTable">
        <thead>
          <tr>
            <th>Stock Symbol</th>
            <th>Price</th>
            <th>Day Chng%</th>
            <th>Day Chng $</th>
            <th>Trade Vol</th>
            <th>Market Cap</th>
            <th>52 Weeks Low</th>
            <th>52 Weeks High</th>
            <th>Earning Date</th>
            <th>Target Price</th>
            <th>Cost Average</th>
            <th>Quantity</th>
            <th>Mkt Val</th>
            <th>Gain/Loss %</th>
            <th>Gain/Loss $</th>
            <th>Company Name</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="stockBody"></tbody>
        <tfoot id="stockFoot"></tfoot>
      </table>
    </section>
  </main>

  <div id="detailModal" class="modal">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <button id="printDetailBtn" class="print-btn">Print</button>
      <div id="detailBody">Loading...</div>
    </div>
  </div>

  <div id="loadingOverlay" class="loading-overlay"><div class="spinner"></div><div class="loading-text">Loading...</div></div>
  <script src="core.js"></script>
  <script src="utils.js"></script>
  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="render.js"></script>
  <script src="events.js"></script>
</body>
</html>
